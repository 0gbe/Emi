<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Emi Pinball 2 By Ogbe</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--lime:#d6ff3a;--line:#5fd0ff;--paper:#eef3f1;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100svh;overflow:hidden;background:#05060a;color:var(--paper);font-family:"IBM Plex Mono",ui-monospace,monospace;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button,input{font-family:inherit}
.cab{min-height:100dvh;display:grid;background:radial-gradient(80% 40% at 50% 0%,#3a2a1c 0%,#1a120c 28%,#07080c 70%)}
.play{display:flex;flex-direction:column;height:100svh;max-height:100svh;overflow:hidden;justify-content:flex-start;padding-top:calc(48px + var(--safe-t));padding-bottom:0;background:#05060a}
.backbox{position:relative;z-index:30;padding:8px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;border:1px solid #6a5438;border-bottom:4px solid #2a2118;background:linear-gradient(#1c1612,#0c0a08);box-shadow:inset 0 1px 0 rgba(255,220,160,.25)}
.brand{display:none}
.dmd{display:flex;gap:3px;justify-content:flex-end}
.dmd-label{display:none}
.dig{width:16px;height:24px;border-radius:3px;background:#041006;color:#163018;display:grid;place-items:center;font-family:"Archivo Black",sans-serif;font-size:16px}
.dig.on{color:#e9ff9a;box-shadow:0 0 10px rgba(214,255,58,.45)}
.dig.hot{color:#fff}
.meta{display:flex;align-items:center;gap:8px;width:100%;justify-content:space-between;background:#10160c;border:2px solid #d6ff3a;border-radius:12px;padding:8px}
.status{flex:1;font-size:10px;letter-spacing:.12em;color:var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pips{display:flex;gap:5px}.pip{width:8px;height:8px;border-radius:50%;background:#12161c}.pip.on{background:var(--lime)}
.status{display:block;margin:8px 0 12px;color:#d6ff3a}
.icon-btn{min-width:84px;height:48px;padding:0 10px;border-radius:10px;border:2px solid #d6ff3a;background:#1c2a10;color:#f4ffe0;touch-action:manipulation;font-size:13px;font-weight:700;letter-spacing:.1em;box-shadow:0 0 12px rgba(214,255,58,.35)}
.spiral{width:52px;height:52px;touch-action:manipulation;box-shadow:0 0 12px rgba(214,255,58,.45);border-radius:50%;border:1px solid rgba(214,255,58,.5);background:radial-gradient(circle at 40% 40%,#1a2214,#07080c);color:var(--lime);display:grid;place-items:center;padding:0}
.spiral svg{width:22px;height:22px;transition:transform .4s}
.spiral.on{border-color:#ff4fd8;color:#ff4fd8;box-shadow:0 0 14px rgba(255,80,220,.7)}
.spiral.on svg{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
body.trippy{background:#140018;color:#ffe6ff}
body.trippy .cab{background:radial-gradient(90% 70% at 50% 0%,#3a1060 0%,#120018 55%)}
body.trippy .backbox{background:#16001c;border-bottom-color:rgba(255,80,200,.45)}
body.trippy .brand h1{color:#ff4fd8}
body.trippy .brand small,body.trippy .status{color:#7af0ff}
body.trippy .dig.on{color:#ffe56a;box-shadow:0 0 12px rgba(255,80,220,.6)}
body.trippy canvas{box-shadow:0 0 0 1px #ff4fd8,0 0 0 7px #1a0824,0 0 24px rgba(255,80,220,.45)}
body.trippy .apron .spring{background:linear-gradient(#4a1868,#1a0824);color:#ffe6ff;border-color:#ff4fd8}
.stage{position:relative;flex:0 0 auto;width:min(92vw,420px);margin:28px auto 0;min-height:0;overflow:visible;display:flex;flex-direction:column;align-items:stretch;padding:0}
canvas{display:block;width:100%;height:auto;max-height:calc(100svh - 460px);aspect-ratio:400/640;border-radius:8px 8px 2px 2px;background:#07080c;touch-action:none;box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 0 0 2px #c9d4de,0 0 0 6px #1b140e}
.overlay,.sheet-wrap{position:absolute;inset:8px 10px 4px;display:grid;place-items:center;pointer-events:none;z-index:4}
.card,.sheet{pointer-events:auto;width:min(340px,92%);background:rgba(8,10,14,.94);border:1px solid rgba(95,208,255,.4);border-radius:16px;padding:16px}
.card h2,.sheet h2{font-family:"Archivo Black",sans-serif;font-size:22px;margin:0 0 6px;color:var(--lime)}
.lede{margin:0 0 12px;font-size:12px;line-height:1.45;color:#d5ddd8}
.credit{margin:10px 0 0;font-size:11px}.credit a{color:var(--line)}
.text-btn{border:1px solid rgba(95,208,255,.4);background:transparent;color:var(--paper);border-radius:999px;padding:10px 14px;letter-spacing:.14em;font-size:12px}
.text-btn.solid{background:var(--lime);color:#111;border-color:var(--lime);font-weight:700;width:100%;min-height:48px}
.row-actions{display:flex;gap:8px;margin-top:10px}
label{display:block;font-size:10px;letter-spacing:.16em;color:var(--line)}
input{width:100%;margin-top:6px;background:#0a0c10;border:1px solid #2a3644;color:var(--paper);border-radius:10px;padding:10px 12px;font-size:16px}
.note{min-height:16px;font-size:11px;color:#f0d7a2;margin:8px 0 0}
.board{display:none;position:fixed;left:12px;right:12px;top:64px;z-index:80;max-height:70vh;overflow:auto;padding:18px 16px;background:#0c0b0a;border:1px solid #8a7358;border-radius:12px}
.board h3{margin:0 0 10px;font-family:"Archivo Black",sans-serif;letter-spacing:.12em;font-size:13px;color:var(--line)}
.score-row{display:grid;grid-template-columns:22px 1fr auto;gap:8px;font-size:12px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.score-row b{color:var(--lime);font-weight:500}.empty{color:#8a8175;font-size:12px}
.apron{position:relative;flex:none;z-index:8;width:100%;background:linear-gradient(#2a2118,#120e0b);border-top:0;display:grid;grid-template-columns:28px 14px minmax(0,1fr) 64px minmax(0,1fr) 14px 28px;gap:6px;padding:6px 6px 0;margin:0}
.edge-guard{height:calc(160px + var(--safe-b));flex:none;pointer-events:none;background:#05060a}
.apron button{height:72px;border-radius:40px;font-size:13px;border:2px solid #d7d2c8;background:radial-gradient(circle at 50% 30%,#ff5a4a,#8d1c16);color:#fff;letter-spacing:.08em;font-weight:700;touch-action:none;-webkit-appearance:none;appearance:none;outline:none;box-shadow:0 4px 0 #3a120e,inset 0 2px 0 rgba(255,255,255,.35)}
.apron button:active,.apron button:focus,.apron button:hover{background:linear-gradient(#1c2430,#10141a);color:var(--paper);border-color:#243044;filter:none;opacity:1}
.apron .flip{font-size:18px;letter-spacing:.14em;min-width:0}
.apron .flip:active{background:linear-gradient(#1c2430,#10141a);color:var(--paper);box-shadow:inset 0 0 0 1px rgba(95,208,255,.45)}
.apron .spring{background:linear-gradient(#163044,#0c1824);color:#d7f6ff;border-color:#5fd0ff}
.apron .spring:active{background:linear-gradient(#163044,#0c1824);color:#d7f6ff;border-color:#5fd0ff;box-shadow:inset 0 0 12px rgba(95,208,255,.35)}
.hidden{display:none!important}
@media(min-width:960px){.cab{grid-template-columns:minmax(420px,560px) 300px;justify-content:center}.board{display:block}canvas{width:min(460px,70vh*.625)}}
</style></head><body>
<div class="cab"><section class="play">
<header class="backbox"><div class="meta"><button class="spiral" id="tripBtn" type="button" aria-label="Trippy mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 12c2 0 3-1.2 3-2.4S13.6 7 12 7s-3 1-3 2.4 1 2.6 3 2.6z"/><path d="M12 12c3.2 0 5-2 5-4.2S15.2 3.4 12 3.4 6.6 5.4 6.6 7.8 8.8 12 12 12z"/><path d="M12 12c4.4 0 7.2-2.8 7.2-6.2"/></svg></button>
<button class="icon-btn" id="boardBtn" type="button">SCORES</button>
<button class="icon-btn" id="groundBtn" type="button">LOOK</button>
<button class="icon-btn" id="muteBtn" type="button">SOUND</button></div></header>
<div class="stage"><canvas id="table" width="400" height="640"></canvas>
<div class="apron"><div></div><button class="nudge" id="nudgeL" type="button">‹</button>
<button class="flip" id="leftBtn" type="button">LEFT</button>

<button class="nudge" id="nudgeR" type="button">›</button><div></div></div>

<button class="text-btn solid" id="startBtn" type="button">START</button>
<p class="credit"><a href="https://emi.ogbe.art" target="_blank" rel="noreferrer">Emi.ogbe.art</a></p></div></div>
<div class="sheet-wrap hidden" id="sheetWrap"><form class="sheet" id="saveForm"><h2>PUT IT UP</h2>
<label>X HANDLE<input id="handle" maxlength="80" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="yourhandle"></label>
<p class="note" id="note"></p><div class="row-actions"><button class="text-btn solid" type="submit">PUT IT UP</button>
<button class="text-btn" id="skipBtn" type="button">SKIP</button></div></form></div></div>
<div class="edge-guard"></div></section>
<aside class="board" id="board"><h3>SCORE</h3><div class="dmd" id="dmd"></div><div class="pips" id="pips"></div><div class="status" id="status">PULL FOR SPIRITS</div><h3>TOP TEN</h3><div id="boardList"></div></aside></div>

    const blink = S.eyeBlink > .82 ? (S.eyeBlink - .82) / .18 : 0;
    const morph = S.jackpot ? .7 : Math.min(.55, Math.hypot(b.vx, b.vy) / 900);
    ctx.fillStyle = "#10140c";
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
    const scl = ctx.createRadialGradient(-3, -4, 1, 0, 1, r);
    scl.addColorStop(0, "#fff");
    scl.addColorStop(.62, "#f3efe6");
    scl.addColorStop(1, "#c8c0b2");
    ctx.fillStyle = scl;
    ctx.beginPath();
    ctx.ellipse(0, 0, r * .86, r * .86 * (1 - blink * .92), 0, 0, 7);
    ctx.fill();
    const ang = Math.atan2(b.vy || 1, b.vx || .01);
    const ix = Math.cos(ang) * r * .28;
    const iy = Math.sin(ang) * r * .28;
    const iris = ctx.createRadialGradient(ix - 1, iy - 1, 1, ix, iy, r * .46);
    iris.addColorStop(0, "#f4ffb0");
    iris.addColorStop(.42, LIME);
    iris.addColorStop(1, "#4e6a10");
    ctx.fillStyle = iris;
    ctx.beginPath(); ctx.arc(ix, iy, r * .42 + morph * 1.4, 0, 7); ctx.fill();
    ctx.fillStyle = "#070806";
    if (morph > .35) {
      ctx.beginPath(); ctx.ellipse(ix - 1.6, iy, 1.3, 3.1, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(ix + 1.6, iy, 1.3, 3.1, 0, 0, 7); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(ix, iy, r * .16, 0, 7); ctx.fill();
    }
    ctx.fillStyle = "rgba(255,255,255,.8)";
    ctx.beginPath(); ctx.ellipse(-r * .32, -r * .32, r * .22, r * .12, -.45, 0, 7); ctx.fill();
    if (blink > 0) {
      ctx.fillStyle = "#10140c";
      ctx.fillRect(-r, -r, r * 2, r * blink);
      ctx.fillRect(-r, r * (1 - blink), r * 2, r * blink);
    }
    ctx.restore();
  }
  function draw() {
    if (!staticLayer) buildStatic();
    fit(0, 0);
    ctx.drawImage(staticLayer, 0, 0);
    const sx = (Math.random() - .5) * S.shake;
    const sy = (Math.random() - .5) * S.shake;
    fit(sx, sy);
    lamps.forEach((lamp, i) => {
      const x = 36 + (i % 7) * 52;
      const y = i < 7 ? 54 : 430;
      if (lamp.lit > .04) {
        ctx.globalAlpha = lamp.lit * .85;
        ctx.drawImage(glow, x - 14, y - 14, 28, 28);
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = lamp.lit > .2 ? LIME : "#1a2214";
      ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fill();
      ctx.strokeStyle = lamp.lit > .2 ? "#f4ffc4" : "#3a3228";
      ctx.lineWidth = 1;
      ctx.stroke();
    });
    lanes.forEach((lane, i) => drawInsert(lane.x, 92, lane.key, S.emi[i] ? 1 : .15, S.emi[i]));
    nums.forEach(n => drawInsert(n.x, n.y, n.n, n.lit, n.lit > .6));
    drawInsert(318, 168, S.jackpot ? "222" : "222", S.jackpot ? 1 : .12);
    drops.forEach(d => {
      ctx.fillStyle = d.down ? "#1a220f" : "#10140c";
      roundRect(d.x - 16, d.y - 7, 32, 14, 3);
      ctx.fill();
      ctx.strokeStyle = d.lit > .3 ? LIME : "#3c4630";
      ctx.stroke();
      if (d.lit > .05) {
        ctx.globalAlpha = d.lit;
        ctx.drawImage(glow, d.x - 20, d.y - 18, 40, 36);
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = d.lit > .3 ? "#f3ffc4" : "#6d7a52";
      ctx.font = "700 11px IBM Plex Mono, monospace";
      ctx.textAlign = "center";
      
    });
    ctx.save();
    ctx.translate(268, 338);
    ctx.rotate(S.spin);
    ctx.strokeStyle = AMBER;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.moveTo(0, -10); ctx.lineTo(0, 10); ctx.stroke();
    ctx.restore();
    if (S.warpOpen && (S.portalLock || 0) <= 0) {
      ctx.save();
      const pulse = .55 + Math.sin(S.time * 14) * .25;
      ctx.globalAlpha = pulse;
      ctx.strokeStyle = "#9ee7ff";
      ctx.shadowColor = "#5fd0ff";
      ctx.shadowBlur = 16;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(162, 56);
      ctx.lineTo(238, 56);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#d8e8f4";
      ctx.beginPath(); ctx.arc(158, 56, 5, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(242, 56, 5, 0, 7); ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
    }
    if (S.laser > 0) {
      const tx = S.mate ? S.mate.x : 200;
      const ty = S.mate ? S.mate.y : 120;
      ctx.save();
      ctx.globalAlpha = Math.min(1, S.laser);
      ctx.strokeStyle = "rgba(214,255,58,.35)";
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.moveTo(200, 292);
      ctx.lineTo(tx, ty);
      ctx.stroke();
      ctx.strokeStyle = "#f7ffd0";
      ctx.shadowColor = "#d6ff3a";
      ctx.shadowBlur = 18;
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.restore();
    }
    if (S.trail) {
      ctx.save();
      S.trail.forEach(t => {
        ctx.globalAlpha = t.life * .45;
        ctx.fillStyle = "#5fd0ff";
        ctx.fillRect(t.x - 1, t.y - 1, 2, 2);
      });
      ctx.restore();
    }
    if ((S.focus || 0) > .05 || (S.tractor || 0) > 0) {
      ctx.save();
      ctx.globalAlpha = Math.max(S.focus || 0, S.tractor ? .8 : 0);
      ctx.strokeStyle = "#d6ff3a";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(200, 292, 40 + (S.focus || 0) * 18, 0, 7);
      ctx.stroke();
      ctx.restore();
    }
    ctx.save();
    ctx.globalAlpha = .35 + Math.sin(S.time * 3) * .12;
    const rib = ctx.createLinearGradient(150, 262, 250, 262);
    rib.addColorStop(0, "rgba(95,208,255,0)");
    rib.addColorStop(.5, "rgba(214,255,58,.85)");
    rib.addColorStop(1, "rgba(95,208,255,0)");
    ctx.strokeStyle = rib;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(154, 262);
    ctx.quadraticCurveTo(200, 252 + Math.sin(S.time * 4) * 3, 246, 262);
    ctx.stroke();
    ctx.restore();
    drawSling(1, S.slingL || 0);
    drawSling(-1, S.slingR || 0);
    bumpers.forEach((b, i) => { if (i === S.hot) { ctx.save(); ctx.globalAlpha = .55; ctx.strokeStyle = "#ffb020"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 8, 0, 7); ctx.stroke(); ctx.restore(); } drawBumper(b); });
    if (S.saver > 0 && S.phase === "play") {
      ctx.save();
      ctx.globalAlpha = .8;
      ctx.fillStyle = "#d6ff3a";
      ctx.fillRect(150, 600, 100 * Math.min(1, S.saver / 3), 4);
      ctx.restore();
    }
    for (let i = 0; i < Math.floor(S.heat || 0); i++) {
      ctx.fillStyle = i >= 3 ? "#ffb020" : "#d6ff3a";
      ctx.fillRect(36 + i * 10, 606, 7, 7);
    }
    ctx.save();
    ctx.font = "700 11px IBM Plex Mono, monospace";
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(214,255,58,.85)";
    ctx.fillText(S.phase === "play" ? (MISSIONS[S.mission] || "CLEAR") : "", 200, 338);
    if ((S.charge || 0) > .05) {
      ctx.fillStyle = "rgba(95,208,255,.85)";
      ctx.fillRect(160, 348, 80 * S.charge, 4);
    }
    if ((S.lock || 0) > 0) {
      ctx.fillStyle = LIME;
      for (let i = 0; i < S.lock; i++) { ctx.beginPath(); ctx.arc(186 + i * 14, 360, 3, 0, 7); ctx.fill(); }
    }
    ctx.restore();
    drawEye();
    drawFlip(flips.L);
    drawFlip(flips.R);
    drawPlunger(S.phase === "ready" ? S.power : 0);
    if (!S.bonusOn) {
      drawBall(ball);
      if (S.mate) drawBall(S.mate);
    } else {
      const n = S.bonusBalls.length;
      const step = n > 40 ? 2 : 1;
      for (let i = 0; i < n; i += step) drawBall(S.bonusBalls[i]);
    }
    ctx.font = "700 13px Archivo Black, sans-serif";
    ctx.textAlign = "center";
    for (const p of S.popups) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = LIME;
      ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    for (const b of S.bits) {
      ctx.globalAlpha = Math.max(0, b.life * 2);
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x, b.y, 2, 2);
    }
    ctx.globalAlpha = 1;
    if (S.flash > 0) {
      ctx.fillStyle = `rgba(214,255,58,${S.flash})`;
      ctx.fillRect(0, 0, W, H);
    }
    if (S.phase === "attract") {
      ctx.fillStyle = "rgba(0,0,0,.25)";
      ctx.fillRect(0, 0, W, H);
    }
    const glass = ctx.createLinearGradient(0, 0, 80, 220);
    glass.addColorStop(0, "rgba(255,255,255,.16)");
    glass.addColorStop(.35, "rgba(255,255,255,0)");
    ctx.fillStyle = glass;
    ctx.fillRect(0, 0, W, H);
    if (S.trippy) {
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      ctx.globalAlpha = .18;
      if (!ctx.createConicGradient) { ctx.restore(); fit(0, 0); return; }
      const g = ctx.createConicGradient(S.time * .6, 200, 300);
      g.addColorStop(0, "#ff2bd6");
      g.addColorStop(.35, "#7af0ff");
      g.addColorStop(.7, "#ffe56a");
      g.addColorStop(1, "#ff2bd6");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    fit(0, 0);
  }

  function paintHud() {
    const text = String(Math.max(0, Math.floor(S.score))).padStart(7, "0");
    for (let i = 0; i < 7; i++) {
      const el = digitEls[i];
      const ch = text[i];
      const changed = shown[i] !== ch;
      el.textContent = ch;
      el.className = "dig" + (ch !== "0" || i === 6 ? " on" : "") + (changed ? " hot" : "");
    }
    shown = text;
    pips.innerHTML = "";
    const left = Math.max(0, S.ballMax - S.ballN + ((S.phase === "ready" || S.phase === "play" || S.bonusOn || S.phase === "tally") ? 1 : 0));
    for (let i = 0; i < Math.max(3, S.ballMax); i++) {
      const pip = document.createElement("i");
      pip.className = "pip" + (i < left ? " on" : "");
      pips.appendChild(pip);
    }
    let line = S.rank;
    if (S.bonusOn) line = S.bonusKind.toUpperCase() + "  " + Math.ceil(S.bonusLeft) + "s";
    else if (S.jackpot) line = S.rank + "  ·  222 LIT";
    else if (S.phase === "play" || S.phase === "ready") line = (MISSIONS[S.mission] || "CLEAR") + "  X" + S.mult + ((S.lock || 0) >= 3 ? "  LOCK" : "") + (S.saver > 0 ? "  SAVE" : "");
    else if (S.phase === "over") line = "GAME OVER  ·  " + S.rank;
    else line = "PULL FOR SPIRITS";
    if (S.trippy) line = "TRIPPY  ·  " + line;
    statusEl.textContent = line;
  }

  function step(dt) {
    S.time += dt;
    if (S.trippy) S.mult = Math.max(S.mult, 2);
    S.eyeBlink = (S.eyeBlink + dt * .35) % 1;
    if (Math.random() < dt * .4) S.eyeBlink = .8;
    S.eyeHit = Math.max(0, S.eyeHit - dt * 1.6);
    nums.forEach(n => { if (!S.emi[nums.indexOf(n)]) n.lit = Math.max(0, n.lit - dt * .15); });
    lamps.forEach((l, i) => {
      if (S.phase === "attract") l.lit = (Math.sin(S.time * 4 + i) > .2) ? .8 : .05;
      else l.lit = Math.max(0, l.lit - dt * .8);
    });
    S.spin += S.spinV * dt;
    S.spinV *= Math.exp(-1.6 * dt);
    S.bonusGrace = Math.max(0, (S.bonusGrace || 0) - dt);
    if (keys.nudgeL && !prevNL) nudge(-1);
    if (keys.nudgeR && !prevNR) nudge(1);
    if (S.phase === "play" && !S.bonusOn && (S.bonusGrace || 0) <= 0) {
      if (!S.bonusUsed && S.score >= 400000) enterBonus("rain");
      else if (!S.herdUsed && S.score >= 1500000) enterBonus("herd");
      else if (!S.maskUsed && S.score >= 25500000) enterBonus("mask");
    }
    if (S.bonusOn) tickBonus(dt);
    else if (S.phase === "tally") {
      S.tally -= dt;
      if (S.tally <= 0) {
        if (S.tilted || S.ballN >= S.ballMax) finish();
        else { S.ballN++; openBall(); }
      }
    } else tickMain(dt);
    prevL = keys.left; prevR = keys.right; prevP = keys.plunger; prevNL = keys.nudgeL; prevNR = keys.nudgeR;
    for (const p of S.popups) p.life -= dt;
    S.popups = S.popups.filter(p => p.life > 0);
    for (const b of S.bits) { b.life -= dt; b.x += b.vx * dt; b.y += b.vy * dt; }
    S.bits = S.bits.filter(b => b.life > 0);
    S.shake *= Math.exp(-6 * dt);
    S.flash = Math.max(0, S.flash - dt);
    S.rank = rankOf(S.score, S.missionClears);
  }
  function finish() {
    S.phase = "over";
    const match = Math.floor(Math.random() * 10);
    const last = S.score % 10;
    if (last === match) {
      gain(Math.floor(S.score * .1));
      popup(200, 280, "MATCH " + match);
    } else popup(200, 280, "NO MATCH " + match);
    S.pendingScore = S.score;
    setTimeout(openSheet, 700);
  }
  function frame(ts) {
    const dt = Math.min(.033, (ts - last) / 1000 || .016);
    last = ts;
    acc += dt;
    let guard = 0;
    while (acc >= 1 / 120 && guard < 4) { step(1 / 120); acc -= 1 / 120; guard++; }
    if (guard >= 4) acc = 0;
    draw();
    paintHud();
    raf = requestAnimationFrame(frame);
  }

  function scores() {
    try { return JSON.parse(localStorage.getItem("emi-pinball-2-board") || "[]"); }
    catch { return []; }
  }
  function saveScores(list) {
    localStorage.setItem("emi-pinball-2-board", JSON.stringify(list));
  }
  function renderBoard() {
    const list = scores().slice().sort((a, b) => b.score - a.score).slice(0, 10);
    const you = (handleInput.value || localStorage.getItem("emi-pinball-2-handle") || "").replace(/^@/, "").toLowerCase();
    if (!list.length) { boardList.innerHTML = '<p class="empty">The board is empty. Be the first.</p>'; return; }
    boardList.innerHTML = list.map((row, i) => {
      const mine = row.display.toLowerCase() === you;
      return `<div class="score-row${mine ? " you" : ""}"><span>${String(i + 1).padStart(2, "0")}</span><span>@${row.display}</span><b>${row.score.toLocaleString("en-US")}</b></div>`;
    }).join("");
  }
  function normalize(raw) {
    let s = String(raw || "").trim();
    s = s.replace(/^https?:\/\/(www\.)?(x|twitter)\.com\//i, "");
    s = s.replace(/^@/, "").split(/[/?#\s]/)[0];
    if (!/^[A-Za-z0-9_]{1,15}$/.test(s)) return null;
    return s;
  }
  function openSheet() {
    sheetWrap.classList.remove("hidden");
    note.textContent = "";
    const saved = localStorage.getItem("emi-pinball-2-handle");
    if (saved) handleInput.value = saved;
    handleInput.focus();
  }
  function closeSheet(msg) {
    sheetWrap.classList.add("hidden");
    if (msg) note.textContent = msg;
    S.pendingScore = null;
    overlay.classList.remove("hidden");
    overlay.querySelector("h2").textContent = "GAME OVER";
    overlay.querySelector(".lede").textContent = msg || "Pull SPRING for another game.";
  }
  document.getElementById("saveForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = normalize(handleInput.value);
    if (!name) { note.textContent = "Use an X handle: letters, numbers, underscores. A profile link is fine."; return; }
    const score = Math.max(1, Math.round(S.pendingScore || S.score));
    const list = scores();
    const prev = list.find(r => r.display.toLowerCase() === name.toLowerCase());
    if (prev && prev.score >= score) {
      note.textContent = `@${prev.display} is already up with ${prev.score.toLocaleString("en-US")}. Beat that score to replace it.`;
      return;
    }
    const next = list.filter(r => r.display.toLowerCase() !== name.toLowerCase());
    next.push({ display: name, score });
    next.sort((a, b) => b.score - a.score);
    saveScores(next);
    localStorage.setItem("emi-pinball-2-handle", name);
    handleInput.value = name;
    const listed = next.slice(0, 10).some(r => r.display.toLowerCase() === name.toLowerCase());
    const msg = listed
      ? "New high score. Your old one is off the board."
      : "Saved as your best. Beat it to move up. The top ten are still ahead.";
    renderBoard();
    closeSheet(msg);
  });
  document.getElementById("skipBtn").addEventListener("click", () => {
    closeSheet("Skipped. The score stays off the board.");
  });
  function startGame() {
    audio.unlock();
    overlay.classList.add("hidden");
    sheetWrap.classList.add("hidden");
    resetTable();
  }
  const arm = () => audio.unlock();
  document.addEventListener("pointerdown", arm, { passive: true });
  document.addEventListener("touchstart", arm, { passive: true });
  document.getElementById("startBtn").addEventListener("pointerdown", (e) => {
    e.preventDefault();
    e.stopPropagation();
    startGame();
  });
  document.addEventListener("touchstart", (e) => {
    if (e.target.closest("input, textarea, a, button, .card, .sheet")) return;
    e.preventDefault();
  }, { passive: false });
  document.addEventListener("touchmove", (e) => {
    if (e.target.closest("input, textarea, button, a, .sheet, .card, .board")) return;
    e.preventDefault();
  }, { passive: false });
  document.addEventListener("gesturestart", (e) => e.preventDefault());

  document.getElementById("springBtn").addEventListener("click", () => {
    if (S.phase === "attract" || S.phase === "over") startGame();
  });
  function bindHold(el, key) {
    const on = (v) => { keys[key] = v; if (v) audio.unlock(); };
    el.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      el.setPointerCapture?.(e.pointerId);
      on(true);
    });
    el.addEventListener("pointerup", () => on(false));
    el.addEventListener("pointercancel", () => on(false));
  }
  bindHold(document.getElementById("leftBtn"), "left");
  bindHold(document.getElementById("rightBtn"), "right");
  bindHold(document.getElementById("springBtn"), "plunger");
  bindHold(document.getElementById("nudgeL"), "nudgeL");
  bindHold(document.getElementById("nudgeR"), "nudgeR");
  window.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D" || e.key === "l") keys.right = true;
    if (e.key === " " || e.key === "ArrowDown") { keys.plunger = true; e.preventDefault(); }
    if (e.key === "z" || e.key === "Z") keys.nudgeL = true;
    if (e.key === "x" || e.key === "X") keys.nudgeR = true;
    if (e.key === "Enter" && (S.phase === "attract" || S.phase === "over")) startGame();
    audio.unlock();
  });
  window.addEventListener("keyup", (e) => {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D" || e.key === "l") keys.right = false;
    if (e.key === " " || e.key === "ArrowDown") keys.plunger = false;
    if (e.key === "z" || e.key === "Z") keys.nudgeL = false;
    if (e.key === "x" || e.key === "X") keys.nudgeR = false;
  });
  function tap(id, fn) {
    const el = document.getElementById(id);
    if (!el) return;
    el.style.touchAction = "manipulation";
    el.style.position = "relative";
    el.style.zIndex = "30";
    const go = (e) => { e.preventDefault(); e.stopPropagation(); audio.unlock(); fn(); };
    el.addEventListener("pointerup", go);
    el.addEventListener("click", go);
  }
  tap("muteBtn", () => {
    S.muted = !S.muted;
    document.getElementById("muteBtn").textContent = S.muted ? "MUTE" : "♫";
    localStorage.setItem("emi-pinball-2-muted", S.muted ? "1" : "0");
  });
  tap("groundBtn", () => {
    S.dark = !S.dark;
    document.getElementById("groundBtn").textContent = S.dark ? "ON" : "G";
    localStorage.setItem("emi-pinball-2-ground", S.dark ? "1" : "0");
    staticLayer = null;
  });
  tap("boardBtn", () => {
    const board = document.getElementById("board");
    const open = board.style.display !== "block";
    board.style.display = open ? "block" : "none";
    if (open) renderBoard();
  });
  tap("tripBtn", () => {
    S.trippy = !S.trippy;
    document.body.classList.toggle("trippy", S.trippy);
    document.getElementById("tripBtn").classList.toggle("on", S.trippy);
    audio.unlock();
    popup(200, 220, S.trippy ? "TRIPPY" : "CLEAN");
  });
  try {
    if (localStorage.getItem("emi-pinball-2-muted") === "1") {
      S.muted = true;
      document.getElementById("muteBtn").setAttribute("aria-pressed", "true");
    }
    if (localStorage.getItem("emi-pinball-2-ground") === "1") {
      S.dark = true;
      document.getElementById("groundBtn").setAttribute("aria-pressed", "true");
    }
    const h = localStorage.getItem("emi-pinball-2-handle");
    if (h) handleInput.value = h;
  } catch {}
  buildStatic();
  renderBoard();
  raf = requestAnimationFrame(frame);
})();


</script></body></html>
